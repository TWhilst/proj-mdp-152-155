---
- name: Setup Docker
  hosts: app1
  become: true
  vars:
    username: "{{ username }}"
    password: "{{ password }}"
  tasks:
    - debug: 
        msg: "Username: {{ username }}, Password: {{ password }}"
    - name: Install packages
      yum:
        name: git, docker
        state: present

    - name: Start docker service
      service:
        name: docker
        state: started
        enabled: true

    - name: Clone repository
      git:
        repo: https://github.com/TWhilst/proj-mdp-152-155.git
        version: project-1
        dest: /home/ec2-user/web

      
    - name: Build Docker image
      command: docker build -t twhilst/webapp .
      args:
        chdir: /home/ec2-user/web/

    - name: Stop docker container
      command: docker stop webapp

    - name: Run Docker container
      command: docker run -dt -p 8080:8080 --name webapp1 twhilst/webapp:latest

    - name: Docker login
      command: docker login -u {{ username }} -p {{ password }}

    - name: Push Docker image to registry
      command: docker push twhilst/webapp:latest