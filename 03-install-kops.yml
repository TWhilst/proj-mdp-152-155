---
- name: Make Installation of Kops
  hosts: k8s_workstation
  become: true
  tasks:
    - name: Install Kops binary
      command: |
        curl -Lo kops https://github.com/kubernetes/kops/releases/download/$(curl -s https://api.github.com/repos/kubernetes/kops/releases/latest | grep tag_name | cut -d '"' -f 4)/kops-linux-amd64

    - name: Validate Kops binary
      command: chmod +x kops
    
    - name: Move Kops binary to /usr/local/bin
      command: mv kops /usr/local/bin/kops

  
         
        

    - name: Validate Kops installation
      command: kops
      register: kops_version  
    - debug: {var: kops_version.stdout}
