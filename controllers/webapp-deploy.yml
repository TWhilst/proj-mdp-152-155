apiVersion: apps/v1
kind: Deployment
metadata:
  name: java-webapp
  labels:
    app: webapp
spec:
  replicas: 3
  selector:
    matchLabels:
      app: webapp
  template:
    metadata:
      labels:
        app: webapp
    spec:
      containers:
      - name: java-webapp
        image: webapp:1.0.1
        ports:
        - containerPort: 8080